<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>KitsuBeat Countdown</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;700;800&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  width: 100%; height: 100%;
  background: #060606;
  display: flex; align-items: center; justify-content: center;
  font-family: Inter, system-ui, sans-serif;
  overflow: hidden;
}

/* 9:16 canvas — scales to fit screen */
.canvas {
  position: relative;
  width: min(100vw, calc(100vh * 9/16));
  aspect-ratio: 9/16;
  background: #0E0E0E;
  overflow: hidden;
  border-radius: 16px;
  box-shadow: 0 32px 80px rgba(0,0,0,0.8);
}

/* Subtle grid */
.grid-tex {
  position: absolute; inset: 0;
  background-image:
    linear-gradient(rgba(255,255,255,0.025) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,255,0.025) 1px, transparent 1px);
  background-size: 5% 5%;
}

/* Red center glow */
.center-glow {
  position: absolute; top: 50%; left: 50%;
  width: 80%; height: 80%;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(220,38,38,0.10) 0%, transparent 65%);
  transform: translate(-50%, -50%);
  animation: pulse-glow 3s ease-in-out infinite;
}
@keyframes pulse-glow {
  0%,100% { opacity:0.6; transform:translate(-50%,-50%) scale(1); }
  50%      { opacity:1;   transform:translate(-50%,-50%) scale(1.1); }
}

/* Orbit ring — visible guide */
.orbit-ring {
  position: absolute; top: 50%; left: 50%;
  width: 52%; height: 0;
  padding-bottom: 52%;
  margin-left: -26%; margin-top: -26%;
  border-radius: 50%;
  border: 1px solid rgba(255,255,255,0.04);
}

/* KitsuBeat icon */
.icon-wrap {
  position: absolute; top: 50%; left: 50%;
  width: 16%; padding-bottom: 16%;
  transform: translate(-50%, -50%);
  border-radius: 22%;
  overflow: hidden;
  box-shadow: 0 0 0 2px rgba(220,38,38,0.25), 0 0 5% rgba(220,38,38,0.20), 0 3% 8% rgba(0,0,0,0.6);
  animation: icon-breathe 3s ease-in-out infinite;
}
@keyframes icon-breathe {
  0%,100% { box-shadow: 0 0 0 2px rgba(220,38,38,0.25), 0 0 5% rgba(220,38,38,0.20), 0 3% 8% rgba(0,0,0,0.6); }
  50%      { box-shadow: 0 0 0 3px rgba(220,38,38,0.45), 0 0 8% rgba(220,38,38,0.32), 0 3% 8% rgba(0,0,0,0.6); }
}
.icon-wrap img {
  position: absolute; inset: 0;
  width: 100%; height: 100%; object-fit: cover;
}

/* Orbit system — each .orbit div spins, placing its dot on the radius */
.orbit {
  position: absolute; top: 50%; left: 50%;
  width: 0; height: 0;
  animation: spin 3s linear infinite;
}
.orbit-b { animation-delay: -1s; }
.orbit-c { animation-delay: -2s; }
@keyframes spin { to { transform: rotate(360deg); } }

.dot {
  position: absolute;
  width: 3%; height: 0; padding-bottom: 3%;
  border-radius: 50%;
  background: #dc2626;
  box-shadow: 0 0 2% rgba(220,38,38,0.7), 0 0 4% rgba(220,38,38,0.3);
  transform: translate(-50%, -50%) translateX(26vmin);
  animation: dot-pulse 3s ease-in-out infinite;
}
.orbit-b .dot { width: 2%; padding-bottom: 2%; background: rgba(220,38,38,0.65); animation-delay: -0.4s; }
.orbit-c .dot { width: 2.5%; padding-bottom: 2.5%; background: rgba(220,38,38,0.8); animation-delay: -0.8s; }
@keyframes dot-pulse {
  0%,100% { opacity:0.85; transform:translate(-50%,-50%) translateX(26vmin) scale(1); }
  50%      { opacity:1;    transform:translate(-50%,-50%) translateX(26vmin) scale(1.3); }
}

/* "Choose your answer" label */
.think-label {
  position: absolute;
  top: 28%; left: 50%; transform: translateX(-50%);
  font-size: 2.2vw;
  font-weight: 700; letter-spacing: 0.22em;
  text-transform: uppercase;
  color: rgba(245,245,244,0.22);
  white-space: nowrap;
  animation: fade-pulse 3s ease-in-out infinite;
}
@keyframes fade-pulse { 0%,100%{opacity:0.6} 50%{opacity:1} }

/* 3-2-1 tiles */
.tiles {
  position: absolute;
  top: 68%; left: 50%; transform: translateX(-50%);
  display: flex; gap: 3%;
}
.tile {
  width: 11vw; height: 11vw; max-width: 64px; max-height: 64px;
  border-radius: 18%;
  border: 1.5px solid rgba(255,255,255,0.06);
  background: rgba(255,255,255,0.03);
  display: flex; align-items: center; justify-content: center;
  font-size: 5vw; font-weight: 800;
  color: rgba(245,245,244,0.22);
  transition: all 0.1s;
}
.tile.t3 { animation: step3 3s steps(1,end) infinite; }
.tile.t2 { animation: step2 3s steps(1,end) infinite; }
.tile.t1 { animation: step1 3s steps(1,end) infinite; }

@keyframes step3 {
  0%     { border-color:rgba(220,38,38,0.45); background:rgba(220,38,38,0.10); color:#ef4444; box-shadow:0 0 2.5vw rgba(220,38,38,0.2); }
  33.33% { border-color:rgba(255,255,255,0.06); background:rgba(255,255,255,0.03); color:rgba(245,245,244,0.22); box-shadow:none; }
}
@keyframes step2 {
  0%     { border-color:rgba(255,255,255,0.06); background:rgba(255,255,255,0.03); color:rgba(245,245,244,0.22); box-shadow:none; }
  33.33% { border-color:rgba(220,38,38,0.45); background:rgba(220,38,38,0.10); color:#ef4444; box-shadow:0 0 2.5vw rgba(220,38,38,0.2); }
  66.66% { border-color:rgba(255,255,255,0.06); background:rgba(255,255,255,0.03); color:rgba(245,245,244,0.22); box-shadow:none; }
}
@keyframes step1 {
  0%,66.65% { border-color:rgba(255,255,255,0.06); background:rgba(255,255,255,0.03); color:rgba(245,245,244,0.22); box-shadow:none; }
  66.66%    { border-color:rgba(220,38,38,0.45); background:rgba(220,38,38,0.10); color:#ef4444; box-shadow:0 0 2.5vw rgba(220,38,38,0.2); }
}
</style>
</head>
